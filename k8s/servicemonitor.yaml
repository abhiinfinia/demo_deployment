apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-deployment
  namespace: demo-app
  labels:
    app: demo-deployment
spec:
  namespaceSelector:
    matchNames:
      - demo-app
  selector:
    matchLabels:
      app: demo-deployment
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
