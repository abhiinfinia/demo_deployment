<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6fb;
      color: #172033;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(20, 40, 80, .08);
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    .subtitle { margin: 0 0 26px; color: #657087; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dce8;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }
    button {
      margin-top: 24px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #3156d8;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; line-height: 1.5; }
    .success { color: #147d48; }
    .error { color: #bd2929; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Employee Registration</h1>
    <p class="subtitle">Enter your details to register.</p>

    <form id="employee-form">
      <label for="name">Full name</label>
      <input id="name" name="name" required maxlength="120"
             autocomplete="name" placeholder="Enter full name">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required maxlength="254"
             autocomplete="email" placeholder="you@example.com">

      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="DevOps">DevOps</option>
        <option value="Development">Development</option>
        <option value="QA">QA</option>
        <option value="HR">Human Resources</option>
      </select>

      <label for="role">Job role</label>
      <select id="role" name="role" required>
        <option value="Engineer">Engineer</option>
        <option value="Senior Engineer">Senior Engineer</option>
        <option value="Team Lead">Team Lead</option>
        <option value="Manager">Manager</option>
      </select>

      <button id="submit-button" type="submit">Register Employee</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("employee-form");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.className = "";
      message.textContent = "Submitting registration...";

      const payload = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch("/api/employees", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Registration failed.");
        }

        message.className = "success";
        message.textContent = result.message;
        form.reset();
      } catch (error) {
        message.className = "error";
        message.textContent = error.message || "Unable to register employee.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
